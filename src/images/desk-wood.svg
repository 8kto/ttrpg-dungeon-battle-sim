<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- Wooden desk: horizontal planks with procedural grain, tiles seamlessly -->
  <!-- The board crossing the tile edge spans the full row with stitched noise, so it continues into the next tile -->
  <defs>
    <filter id="wrap0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="3" stitchTiles="stitch" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="103" stitchTiles="stitch" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.170  0.15 0 0 0 0.097  0.08 0 0 0 0.051  0 0 0 0 1" />
    </filter>
    <filter id="mid0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="23" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="123" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.110  0.15 0 0 0 0.061  0.08 0 0 0 0.033  0 0 0 0 1" />
    </filter>
    <filter id="wrap1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="11" stitchTiles="stitch" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="111" stitchTiles="stitch" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.210  0.15 0 0 0 0.121  0.08 0 0 0 0.063  0 0 0 0 1" />
    </filter>
    <filter id="mid1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="31" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="131" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.150  0.15 0 0 0 0.085  0.08 0 0 0 0.045  0 0 0 0 1" />
    </filter>
    <filter id="wrap2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="7" stitchTiles="stitch" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="107" stitchTiles="stitch" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.120  0.15 0 0 0 0.067  0.08 0 0 0 0.036  0 0 0 0 1" />
    </filter>
    <filter id="mid2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="41" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="141" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.190  0.15 0 0 0 0.109  0.08 0 0 0 0.057  0 0 0 0 1" />
    </filter>
    <filter id="wrap3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="19" stitchTiles="stitch" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="119" stitchTiles="stitch" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.150  0.15 0 0 0 0.085  0.08 0 0 0 0.045  0 0 0 0 1" />
    </filter>
    <filter id="mid3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.024" numOctaves="3" seed="53" />
      <feComponentTransfer result="rings">
        <feFuncR type="table" tableValues="0.1 0.9 0.3 1 0.2 0.8 0 0.9 0.4 1 0.1" />
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.5" numOctaves="2" seed="153" result="fibers" />
      <feComposite in="rings" in2="fibers" operator="arithmetic" k2="0.55" k3="0.6" k4="-0.12" />
      <feColorMatrix values="0.24 0 0 0 0.100  0.15 0 0 0 0.055  0.08 0 0 0 0.030  0 0 0 0 1" />
    </filter>
  </defs>
  <rect y="0" width="1200" height="150" filter="url(#wrap0)" />
  <rect x="380" y="0" width="630" height="150" filter="url(#mid0)" />
  <rect y="150" width="1200" height="150" filter="url(#wrap1)" />
  <rect x="150" y="150" width="610" height="150" filter="url(#mid1)" />
  <rect y="300" width="1200" height="150" filter="url(#wrap2)" />
  <rect x="560" y="300" width="580" height="150" filter="url(#mid2)" />
  <rect y="450" width="1200" height="150" filter="url(#wrap3)" />
  <rect x="60" y="450" width="630" height="150" filter="url(#mid3)" />
  <!-- seams between the planks and butt joints -->
  <g fill="#0d0704">
    <rect y="0" width="1200" height="2" />
    <rect x="380" y="0" width="2" height="150" />
    <rect x="1010" y="0" width="2" height="150" />
    <rect y="150" width="1200" height="2" />
    <rect x="150" y="150" width="2" height="150" />
    <rect x="760" y="150" width="2" height="150" />
    <rect y="300" width="1200" height="2" />
    <rect x="560" y="300" width="2" height="150" />
    <rect x="1140" y="300" width="2" height="150" />
    <rect y="450" width="1200" height="2" />
    <rect x="60" y="450" width="2" height="150" />
    <rect x="690" y="450" width="2" height="150" />
  </g>
  <g fill="#fff" fill-opacity="0.06">
    <rect y="2" width="1200" height="1" />
    <rect y="152" width="1200" height="1" />
    <rect y="302" width="1200" height="1" />
    <rect y="452" width="1200" height="1" />
  </g>
</svg>
